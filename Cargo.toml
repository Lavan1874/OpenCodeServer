[package]
name = "opencodeserver"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native macOS supervisor and control utility for OpenCodeServer"
license = "LicenseRef-Proprietary"
build = "build.rs"

[lib]
name = "opencodeserver"
path = "rust/src/lib.rs"

[[bin]]
name = "OpenCodeServerAgent"
path = "rust/src/bin/agent.rs"

[[bin]]
name = "opencodeserverctl"
path = "rust/src/bin/ctl.rs"

[[bin]]
name = "opencodeserver-test-child"
path = "rust/src/bin/test_child.rs"
required-features = ["test-fixture"]

[features]
default = []
test-fixture = []
diagnostic-local-network = []

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
hmac = "0.12.1"
libc = "0.2.186"
plist = "1.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

# Keychain access is only needed on macOS. security-framework wraps the
# Security framework with a safe API and passes OSStatus codes through
# untouched, which the credential state machine in `keychain.rs` relies on
# (`errSecInteractionNotAllowed` etc.). default-features = false keeps the
# dependency surface minimal (no OSX_10_* feature flags we do not use).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3.7", default-features = false }
security-framework-sys = "2.15"

[build-dependencies]
cc = "=1.4.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = true
